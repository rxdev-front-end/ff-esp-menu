name: build-dylib
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar ImGui
        run: git clone --depth 1 --branch v1.90.9 https://github.com/ocornut/imgui.git

      - name: Compilar com Xcode (Apple)
        run: |
          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -shared -fobjc-arc -fmodules -O2 \
            -isysroot $SDKROOT \
            -arch arm64 -arch arm64e \
            -miphoneos-version-min=15.0 \
            -Iimgui -Iimgui/backends -Isrc \
            src/main.mm src/menu.mm src/esp.cpp \
            imgui/imgui.cpp imgui/imgui_draw.cpp \
            imgui/imgui_tables.cpp imgui/imgui_widgets.cpp \
            imgui/backends/imgui_impl_metal.mm \
            -framework Foundation -framework UIKit -framework Metal -framework MetalKit -framework QuartzCore \
            -lc++ -lobjc -o ffesp.dylib

      - name: Salvar a Dylib
        uses: actions/upload-artifact@v4
        with:
          name: ffesp-dylib
          path: ffesp.dylib
